<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Zero Out{% endblock %}</title>
<script src="https://unpkg.com/htmx.org@1.9.12"></script>
<style>
:root { --fg:#1b1f24; --muted:#656d76; --line:#d8dee4; --accent:#0b5fff; --warn:#9a6700; }
* { box-sizing: border-box; }
body { font: 16px/1.5 system-ui, sans-serif; color: var(--fg); margin: 0 auto; padding: 1rem; max-width: 48rem; }
h1 a { color: inherit; text-decoration: none; }
a { color: var(--accent); }
input, button { font: inherit; padding: .5rem .7rem; border: 1px solid var(--line); border-radius: 6px; }
input { width: 100%; max-width: 22rem; margin: .2rem 0; }
button { background: var(--accent); color: #fff; border-color: var(--accent); cursor: pointer; }
button.small { padding: .15rem .5rem; font-size: .85rem; }
.banner, .error { padding: .6rem .8rem; border-radius: 6px; margin: .8rem 0; }
.banner { background: #fff8c5; color: var(--warn); }
.error { background: #ffebe9; color: #a40e26; }
.stale { background: #fff8c5; color: var(--warn); padding: .4rem .6rem; border-radius: 6px; }
.badge { font-size: .75rem; padding: .05rem .45rem; border-radius: 1rem; border: 1px solid var(--line); color: var(--muted); }
.muted { color: var(--muted); font-size: .85rem; }
details { margin: .3rem 0 .3rem 1rem; border-left: 2px solid var(--line); padding-left: .6rem; }
summary { cursor: pointer; }
audio { width: 100%; max-width: 22rem; display: block; margin: .3rem 0; }
form.inline { display: inline; }
ul.plain { list-style: none; padding: 0; }
ul.plain li { padding: .5rem 0; border-bottom: 1px solid var(--line); }
section { margin: 1.5rem 0; }
</style>
</head>
<body>
<h1><a href="/">Zero Out</a></h1>
{% if not budget_ok %}<div class="banner">Daily call budget reached, try again tomorrow</div>{% endif %}
{% block body %}{% endblock %}
</body>
</html>
