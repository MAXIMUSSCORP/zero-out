<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{% block title %}Zero Out{% endblock %}</title>
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/app.css">
<script src="/static/theme.js"></script>
<script src="/static/htmx.min.js"></script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="bar">
  <div class="bar-in">
    <a class="brand" href="/"><span class="key lit" aria-hidden="true">0</span>Zero Out</a>
    <nav aria-label="Main">
      <a href="/"{% if active == 'companies' %} aria-current="page"{% endif %}>Companies</a>
      {% if local %}<a href="/settings"{% if active == 'settings' %} aria-current="page"{% endif %}>Settings</a>{% endif %}
    </nav>
  </div>
</header>
{% if budget_ok is defined and not budget_ok %}<div class="notice strong budget" role="status">Daily call budget reached. Calls start again tomorrow{% if local %}, or raise the cap in <a href="/settings">Settings</a>{% endif %}.</div>{% endif %}
<main id="main" class="page{% block width %}{% endblock %}">
{% block body %}{% endblock %}
</main>
</body>
</html>
