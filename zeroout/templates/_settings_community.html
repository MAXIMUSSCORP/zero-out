{% from "_settings_macros.html" import field, result %}
<section id="settings-community" aria-labelledby="h-community">
  <div class="section-head"><h2 id="h-community">Community</h2></div>
  <form hx-post="/settings/community" hx-target="#settings-community" hx-swap="outerHTML">
    {{ field(c.fields.repo) }}
    <div class="actions"><button class="btn primary" type="submit">Save</button></div>
  </form>
  <p class="hint" id="github-account" hx-get="/settings/community/account" hx-trigger="load" hx-swap="outerHTML">Looking for your GitHub account.</p>
  {{ result(c) }}
</section>
